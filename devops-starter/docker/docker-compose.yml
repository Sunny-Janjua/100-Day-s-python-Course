version: '3.9'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - APP_ENV=local
      - APP_VERSION=1.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "health_check.py", "--url", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
